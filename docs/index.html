<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1320">
<title>Freeze Tag 3D</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Freeze tag arena"></canvas>

<div class="hud" id="hud">
  <div class="hud-top">
    <div class="pill"><small>ROLE</small><b id="role-label">RUNNER</b></div>
    <div class="pill"><small>FROZEN</small><b><span id="frozen-count">0</span> / <span id="frozen-total">6</span></b><div class="bar"><i id="freeze-fill"></i></div></div>
    <div class="pill"><small>TIME</small><b id="time">02:00</b></div>
    <button id="pause" class="icon" aria-label="Pause">Ⅱ</button>
  </div>
  <div id="objective" class="objective"></div>
  <canvas id="minimap" width="160" height="160"></canvas>
  <div id="toast" class="toast" aria-live="polite"></div>
  <div id="countdown" class="countdown"></div>
  <div class="hint" id="hint"></div>
  <button id="cam-left" class="cam-btn left" aria-label="Rotate camera left">⟲</button><button id="cam-right" class="cam-btn right" aria-label="Rotate camera right">⟳</button>
</div>

<div id="stick" class="stick"><div id="stick-knob"></div></div>

<section id="menu" class="card-wrap">
  <form class="card" onsubmit="return false">
    <span class="eyebrow">FREEZE TAG / 3D</span>
    <h1>Hunt. Hide.<br><em>Freeze everyone.</em></h1>
    <div class="grid">
      <label>Play as<select id="opt-role"><option value="runner">Runner</option><option value="seeker">Seeker</option></select></label>
      <label>Arena<select id="opt-map"></select></label>
      <label>Runners<select id="opt-runners"><option>4</option><option selected>6</option><option>10</option><option>14</option></select></label>
      <label>Seekers<select id="opt-seekers"><option>1</option><option selected>2</option><option>3</option></select></label>
      <label>Round time<select id="opt-duration"><option value="60">1 minute</option><option value="90">90 seconds</option><option value="120" selected>2 minutes</option><option value="180">3 minutes</option></select></label>
      <label>CPU skill<select id="opt-level"></select></label>
      <label>Movement<select id="opt-scheme"><option value="direct">Joystick · WASD · gamepad</option><option value="tap">Tap / click to move</option></select></label>
      <label>Camera<select id="opt-camera"><option value="separate">Separate (you steer it)</option><option value="follow">Follows your character</option></select></label>
    </div>
    <label class="check"><input type="checkbox" id="opt-rescue" checked><span>Runners can thaw frozen teammates (stay close for 1 second)</span></label>
    <button id="start" class="primary">Enter the arena →</button>
    <p class="small">Tag by touching. Move with WASD / arrows, left-thumb joystick or a gamepad. Rotate the camera by dragging, Q/E, or the right stick.</p>
  </form>
</section>

<section id="paused" class="card-dialog" hidden>
  <div class="card">
    <span class="eyebrow">TAKE A BREATHER</span><h1>Paused</h1>
    <div class="grid">
      <label>Movement<select id="pause-scheme"><option value="direct">Joystick · WASD · gamepad</option><option value="tap">Tap / click to move</option></select></label>
      <label>Camera<select id="pause-camera"><option value="separate">Separate (you steer it)</option><option value="follow">Follows your character</option></select></label>
    </div>
    <div class="actions">
      <button id="auto-cam" class="secondary" aria-pressed="true">Auto-recentre: on</button>
      <button id="sound" class="secondary">Sound: on</button>
      <button id="fullscreen" class="secondary">Full screen</button>
    </div>
    <div class="actions"><button id="pause-menu" class="secondary">Match setup</button><button id="resume" class="primary">Keep playing →</button></div>
  </div>
</section>

<section id="result" class="card-dialog" hidden>
  <div class="card">
    <span class="eyebrow" id="result-tag">ROUND OVER</span><h1 id="result-title"></h1><p id="result-description"></p>
    <div class="actions"><button id="result-menu" class="secondary">Match setup</button><button id="replay" class="primary">Play again →</button></div>
  </div>
</section>
<script type="module" src="js/main.js"></script>
</body>
</html>
